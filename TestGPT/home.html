<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structure de page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Colonne de gauche (Menu) -->
        <aside class="left-column">
            <p>Menu</p>
        </aside>

        <!-- Partie principale -->
        <main class="main-content">
            <!-- Partie gauche -->
            <div class="left-side">
                <div class="header">Entête</div>
                <div class="zone zone-1">Zone 1</div>
                <div class="zone zone-2">Zone 2</div>
                <div class="zone zone-3">Zone 3</div>
                <div class="zone zone-4">Zone 4</div>
            </div>

            <!-- Partie droite -->
            <div class="right-side">
                <div class="zone zone-5">Zone 5</div>
                <div class="zone zone-6">Zone 6</div>
                <div class="zone zone-7">Zone 7</div>
                <div class="zone zone-8">Zone 8</div>
                <div class="zone zone-9">Zone 9</div>
            </div>
        </main>
    </div>
</body>
</html>
